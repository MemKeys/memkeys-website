<svg xmlns="http://www.w3.org/2000/svg" class="mkff" viewBox="0 0 1200 740" width="1200" height="740" fill="none" role="img" aria-label="MemKeys fact-flow: an agent emits a raw fact (1); the server keys and appends it to the single keyed core (2); graph and vector views are derived from it (3); agents retrieve by key, by scoped search, or by graph traversal (4). Store, fetch, search and traverse are the four operations of the contract.">
  <title>MemKeys fact-flow — emit, key &amp; append, derive, retrieve across the four-op contract</title>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17356F"/>
      <stop offset="1" stop-color="#3E6FD9"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3E6FD9"/>
    </marker>
    <marker id="arrowD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8AA6D8"/>
    </marker>
  </defs>

  <style>
    /* One brand palette, routed through CSS custom properties so the same file
       themes from the page (var --mk-*) yet renders standalone via the literal
       fallbacks. --mk-fig-ground / --mk-fig-surface let a page remap the figure
       ground; the landing band fixes them to paper. All selectors are scoped to
       .mkff so inlining the SVG into a page can never leak these rules. */
    .mkff{
      --_ink:var(--mk-ink,#17356F);
      --_blue:var(--mk-blue,#3E6FD9);
      --_accent:var(--mk-accent,#F7C948);
      --_ground:var(--mk-ground,#0B1830);
      --_reverse:var(--mk-reverse,#EAF1FF);
      --_paper:var(--mk-fig-ground,var(--mk-paper,#F7F4EC));
      --_surface:var(--mk-fig-surface,#ffffff);
      --_muted:#4A618C; --_mutedD:#8AA6D8;
      --_core2:#13294F; --_cardline:#2A4A86; --_chip:#1C3A6E; --_track:#09142A;
    }
    .mkff text{font-family:'IBM Plex Sans',system-ui,'Segoe UI',sans-serif}
    .mkff .mono{font-family:'IBM Plex Mono','SF Mono',ui-monospace,monospace}
    .mkff .h{font-weight:700;fill:var(--_ink)}
    .mkff .lbl{font-weight:600;fill:var(--_ink)}
    .mkff .sub{font-weight:400;fill:var(--_muted)}
    .mkff .ink{fill:var(--_ink)}
    .mkff .onDark{fill:var(--_reverse)}
    .mkff .mutedD{fill:var(--_mutedD)}
    .mkff .keyed{fill:var(--_accent)}
    .mkff .bg{fill:var(--_paper)}
    .mkff .surface{fill:var(--_surface)}
    .mkff .coreBg{fill:var(--_ground)}
    .mkff .card{fill:var(--_core2)}
    .mkff .chip{fill:var(--_chip)}
    .mkff .track{fill:var(--_track)}
    .mkff .edge{stroke:var(--_blue)}
    .mkff .node{fill:var(--_ink)}
    .mkff .dot{fill:var(--_blue)}
    .mkff .strokeInk{stroke:var(--_ink)}
    .mkff .strokeMutedD{stroke:var(--_mutedD)}
    .mkff .strokeCardline{stroke:var(--_cardline)}
    .mkff .strokeAccent{stroke:var(--_accent)}
    /* Numbered waypoint badge: ink disc, reverse number — never gold text. */
    .mkff .wp circle{fill:var(--_ink)}
    .mkff .wp text{fill:var(--_reverse);font-weight:700;text-anchor:middle}
    .mkff .wpcap{fill:var(--_ink);font-weight:600;text-anchor:middle}
  </style>

  <rect class="bg" width="1200" height="740"/>

  <!-- ===================== (1) AGENTS — emit ===================== -->
  <text class="h" x="60" y="70" font-size="20">Your agents</text>
  <g>
    <rect class="surface strokeInk" x="60" y="92" width="150" height="56" rx="12" stroke-width="1.5"/>
    <circle cx="90" cy="120" r="10" fill="url(#ring)"/>
    <text class="lbl" x="110" y="117" font-size="14">Coder</text>
    <text class="sub" x="110" y="134" font-size="11">writes · recalls</text>

    <rect class="surface strokeInk" x="60" y="162" width="150" height="56" rx="12" stroke-width="1.5"/>
    <circle cx="90" cy="190" r="10" fill="url(#ring)"/>
    <text class="lbl" x="110" y="187" font-size="14">Reviewer</text>
    <text class="sub" x="110" y="204" font-size="11">writes · recalls</text>

    <rect class="surface strokeInk" x="60" y="232" width="150" height="56" rx="12" stroke-width="1.5"/>
    <circle cx="90" cy="260" r="10" fill="url(#ring)"/>
    <text class="lbl" x="110" y="257" font-size="14">Researcher</text>
    <text class="sub" x="110" y="274" font-size="11">writes · recalls</text>
  </g>

  <!-- arrows agents -> core (the write path) -->
  <path class="edge" d="M212 120 C 250 120, 250 300, 300 300" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path class="edge" d="M212 190 C 250 190, 255 310, 300 312" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path class="edge" d="M212 260 C 250 260, 258 322, 300 324" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- waypoint 1: emit -->
  <g class="wp">
    <circle cx="244" cy="300" r="15"/>
    <text x="244" y="305" font-size="15">1</text>
  </g>
  <text class="wpcap" x="244" y="338" font-size="12">emit</text>
  <text class="sub" x="244" y="353" font-size="10" text-anchor="middle">raw fact</text>

  <!-- ===================== (2) KEYED CORE — key & append ===================== -->
  <rect class="coreBg" x="300" y="60" width="330" height="520" rx="20"/>
  <text class="onDark" x="330" y="100" font-size="22" font-weight="700">The keyed core</text>
  <text class="mutedD" x="330" y="124" font-size="13">Every fact stored by the keys that describe it</text>

  <!-- waypoint 2: key & append (top-right of core) -->
  <g class="wp">
    <circle cx="600" cy="90" r="15"/>
    <text x="600" y="95" font-size="15">2</text>
  </g>
  <text class="mutedD" x="600" y="46" font-size="12" text-anchor="middle" font-weight="600">key &amp; append</text>

  <!-- superseded-ghost: a prior version of card 1 stacked behind it, dimmed and
       dashed — append-only history, kept and never overwritten. -->
  <g opacity="0.5">
    <rect class="card strokeCardline" x="320" y="126" width="266" height="118" rx="14" stroke-width="1.5" stroke-dasharray="5 5"/>
    <circle class="keyed" cx="344" cy="143" r="6"/>
    <text class="mutedD mono" x="358" y="147" font-size="11.5">"…pgvector:pg16"</text>
    <text class="mutedD mono" x="572" y="147" font-size="10" text-anchor="end">superseded</text>
  </g>

  <!-- card 1 (current) -->
  <g>
    <rect class="card strokeCardline" x="330" y="150" width="270" height="118" rx="14" stroke-width="1.5"/>
    <circle class="keyed" cx="356" cy="182" r="9"/>
    <path class="keyed" d="M352.3 188.2 L359.7 188.2 L357.7 202 L354.3 202 Z"/>
    <text class="onDark mono" x="376" y="180" font-size="13" font-weight="700">"use pgvector/pgvector:pg18"</text>
    <text class="mutedD" x="376" y="197" font-size="11">keyed value · current</text>
    <g font-size="11" class="mono">
      <rect class="chip" x="330" y="214" width="92" height="22" rx="11"/>
      <text class="onDark" x="376" y="229" text-anchor="middle">project:memkeys</text>
      <rect class="chip" x="430" y="214" width="78" height="22" rx="11"/>
      <text class="onDark" x="469" y="229" text-anchor="middle">issue:6319</text>
      <rect class="chip" x="516" y="214" width="70" height="22" rx="11"/>
      <text class="onDark" x="551" y="229" text-anchor="middle">agent:arch</text>
    </g>
    <rect class="track" x="330" y="246" width="270" height="8" rx="4"/>
    <rect class="keyed" x="330" y="246" width="150" height="8" rx="4" opacity="0.85"/>
  </g>

  <!-- card 2 -->
  <g>
    <rect class="card strokeCardline" x="330" y="282" width="270" height="118" rx="14" stroke-width="1.5"/>
    <circle class="keyed" cx="356" cy="314" r="9"/>
    <path class="keyed" d="M352.3 320.2 L359.7 320.2 L357.7 334 L354.3 334 Z"/>
    <text class="onDark mono" x="376" y="312" font-size="13" font-weight="700">"VIP is 10.0.0.220"</text>
    <text class="mutedD" x="376" y="329" font-size="11">keyed value</text>
    <g font-size="11" class="mono">
      <rect class="chip" x="330" y="346" width="92" height="22" rx="11"/>
      <text class="onDark" x="376" y="361" text-anchor="middle">project:memkeys</text>
      <rect class="chip" x="430" y="346" width="92" height="22" rx="11"/>
      <text class="onDark" x="476" y="361" text-anchor="middle">env:k8squad</text>
      <rect class="chip" x="530" y="346" width="56" height="22" rx="11"/>
      <text class="onDark" x="558" y="361" text-anchor="middle">pr:39</text>
    </g>
    <rect class="track" x="330" y="378" width="270" height="8" rx="4"/>
    <rect class="keyed" x="330" y="378" width="210" height="8" rx="4" opacity="0.85"/>
  </g>

  <!-- card 3 -->
  <g>
    <rect class="card strokeCardline" x="330" y="414" width="270" height="118" rx="14" stroke-width="1.5"/>
    <circle class="keyed" cx="356" cy="446" r="9"/>
    <path class="keyed" d="M352.3 452.2 L359.7 452.2 L357.7 466 L354.3 466 Z"/>
    <text class="onDark mono" x="376" y="444" font-size="13" font-weight="700">"chart v0.3.0 → OCI"</text>
    <text class="mutedD" x="376" y="461" font-size="11">keyed value</text>
    <g font-size="11" class="mono">
      <rect class="chip" x="330" y="478" width="92" height="22" rx="11"/>
      <text class="onDark" x="376" y="493" text-anchor="middle">project:memkeys</text>
      <rect class="chip" x="430" y="478" width="98" height="22" rx="11"/>
      <text class="onDark" x="479" y="493" text-anchor="middle">decision:release</text>
    </g>
    <rect class="track" x="330" y="510" width="270" height="8" rx="4"/>
    <rect class="keyed" x="330" y="510" width="110" height="8" rx="4" opacity="0.85"/>
  </g>

  <!-- legend inside core -->
  <circle class="keyed" cx="340" cy="556" r="6"/>
  <text class="mutedD" x="352" y="560" font-size="11">keyed value</text>
  <rect class="keyed" x="452" y="551" width="24" height="7" rx="3.5" opacity="0.85"/>
  <text class="mutedD" x="482" y="560" font-size="11">validity window</text>

  <!-- ===================== (3) DERIVED VIEWS — derive ===================== -->
  <text class="h" x="700" y="70" font-size="20">Derived views</text>
  <text class="sub" x="700" y="90" font-size="13">built on top of the keyed core — never a separate store</text>

  <!-- derived arrows from core (async projection) -->
  <path class="strokeMutedD" d="M636 210 C 680 210, 690 185, 740 185" stroke-width="2.5" stroke-dasharray="6 5" fill="none" marker-end="url(#arrowD)"/>
  <path class="strokeMutedD" d="M636 450 C 680 450, 690 470, 740 470" stroke-width="2.5" stroke-dasharray="6 5" fill="none" marker-end="url(#arrowD)"/>
  <text class="sub mono" x="648" y="430" font-size="11">derived</text>

  <!-- waypoint 3: derive (on the projection path) -->
  <g class="wp">
    <circle cx="690" cy="168" r="15"/>
    <text x="690" y="173" font-size="15">3</text>
  </g>
  <text class="wpcap" x="690" y="138" font-size="12">derive</text>
  <text class="sub" x="690" y="153" font-size="10" text-anchor="middle">async · rebuildable</text>

  <!-- GRAPH VIEW panel -->
  <rect class="surface strokeMutedD" x="740" y="120" width="400" height="190" rx="16" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text class="lbl" x="762" y="150" font-size="16">Graph view</text>
  <text class="sub" x="762" y="169" font-size="12">traverse relationships between keyed facts</text>
  <g class="edge" stroke-width="2">
    <line x1="840" y1="250" x2="930" y2="215"/>
    <line x1="930" y1="215" x2="1030" y2="250"/>
    <line x1="930" y1="215" x2="960" y2="285"/>
    <line x1="840" y1="250" x2="960" y2="285"/>
    <line x1="1030" y1="250" x2="1075" y2="285"/>
  </g>
  <g>
    <circle class="node" cx="840" cy="250" r="13"/>
    <circle class="keyed" cx="930" cy="215" r="15"/>
    <circle class="node" cx="1030" cy="250" r="13"/>
    <circle class="node" cx="960" cy="285" r="11"/>
    <circle class="node" cx="1075" cy="285" r="11"/>
  </g>
  <text class="ink" x="930" y="196" font-size="10" text-anchor="middle">keyed node</text>

  <!-- VECTOR VIEW panel -->
  <rect class="surface strokeMutedD" x="740" y="390" width="400" height="190" rx="16" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text class="lbl" x="762" y="420" font-size="16">Vector view</text>
  <text class="sub" x="762" y="439" font-size="12">semantic search when you don't know the key</text>
  <!-- scope halo: keys bound the candidate set BEFORE similarity (gold >=2px stroke, allowed on paper) -->
  <rect class="strokeAccent" x="856" y="450" width="200" height="112" rx="18" fill="none" stroke-width="2"/>
  <rect class="chip" x="876" y="440" width="160" height="20" rx="10"/>
  <text class="onDark mono" x="956" y="454" font-size="10.5" text-anchor="middle">scope: project:memkeys</text>
  <!-- similarity radius within the scope -->
  <circle class="keyed" cx="946" cy="508" r="40" opacity="0.10"/>
  <circle class="strokeAccent" cx="946" cy="508" r="40" fill="none" stroke-width="1.5" stroke-dasharray="5 5"/>
  <circle class="keyed" cx="946" cy="508" r="7"/>
  <g class="dot">
    <circle cx="920" cy="492" r="5"/>
    <circle cx="972" cy="496" r="5"/>
    <circle cx="928" cy="534" r="5"/>
    <circle cx="968" cy="530" r="5"/>
  </g>
  <!-- distant points, outside the scope -->
  <g fill="#B9C6DE">
    <circle cx="800" cy="552" r="5"/>
    <circle cx="1092" cy="462" r="5"/>
    <circle cx="1096" cy="548" r="5"/>
  </g>
  <text class="ink" x="946" y="476" font-size="10" text-anchor="middle">query</text>

  <!-- waypoint 4: retrieve (reads come back out) -->
  <g class="wp">
    <circle cx="1120" cy="350" r="15"/>
    <text x="1120" y="355" font-size="15">4</text>
  </g>
  <text class="wpcap" x="1120" y="388" font-size="12">retrieve</text>
  <text class="sub" x="1120" y="403" font-size="10" text-anchor="middle">by key · in scope · by hop</text>

  <!-- ===================== FOUR-OP STRIP ===================== -->
  <text class="h" x="60" y="624" font-size="14">The four-op contract</text>
  <rect class="surface strokeInk" x="60" y="636" width="1080" height="64" rx="16" stroke-width="1.5"/>
  <line class="strokeInk" x1="330" y1="648" x2="330" y2="688" stroke-width="1" opacity="0.25"/>
  <line class="strokeInk" x1="600" y1="648" x2="600" y2="688" stroke-width="1" opacity="0.25"/>
  <line class="strokeInk" x1="870" y1="648" x2="870" y2="688" stroke-width="1" opacity="0.25"/>

  <text class="lbl mono" x="84" y="667" font-size="15">Store</text>
  <text class="sub" x="84" y="686" font-size="11.5">write a fact, keyed</text>
  <text class="mutedD mono" x="300" y="667" font-size="10" text-anchor="end">1·2</text>

  <text class="lbl mono" x="354" y="667" font-size="15">Fetch</text>
  <text class="sub" x="354" y="686" font-size="11.5">by the keys you know</text>
  <text class="mutedD mono" x="570" y="667" font-size="10" text-anchor="end">4</text>

  <text class="lbl mono" x="624" y="667" font-size="15">Search</text>
  <text class="sub" x="624" y="686" font-size="11.5">semantic, within a scope</text>
  <text class="mutedD mono" x="840" y="667" font-size="10" text-anchor="end">4</text>

  <text class="lbl mono" x="894" y="667" font-size="15">Traverse</text>
  <text class="sub" x="894" y="686" font-size="11.5">hop the graph</text>
  <text class="mutedD mono" x="1116" y="667" font-size="10" text-anchor="end">4</text>

  <!-- caption -->
  <text class="h" x="600" y="728" font-size="15" text-anchor="middle">Store once, keyed.  Graph and vector are views on the same facts — not three copies to keep in sync.</text>
</svg>
